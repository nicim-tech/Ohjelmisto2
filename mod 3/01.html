<!DOCTYPE html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viisi numeroa</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <script>
    let luvut = [];

    for (let i = 0; i < 5; i++) {
        let luku = Number(prompt("Anna luku:"));
        luvut.push(luku);
    }

    console.log("Luvut käänteisessä järjestyksessä:");

    for (let i = luvut.length - 1; i >= 0; i--) {
    console.log(luvut[i]);
    }
    </script>
  </body>
</html>
