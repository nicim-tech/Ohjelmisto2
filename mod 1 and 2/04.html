<!DOCTYPE html>
<html>
    <head>
    <meta charset="UTF-8" />
    <title>Lajitteluhattu</title>
  </head>
  <body>
    <p id="target"></p>

    <script>
      "use strict";
        const oppilas = prompt("Type your name: ");
        const number = Math.floor(Math.random() * 4) + 1;
         let house;

      if (number === 1) {
        house = "Rohkelikko";
      } else if (number === 2) {
        house = "Luihuinen";
      } else if (number === 3) {
        house = "Puuskupuh";
      } else {
        house = "Korpinkynsi";
      }

      document.querySelector("#target").innerHTML =
        oppilas + ", sinä olet " + house + ".";

    </script>
  </body>
</html>
