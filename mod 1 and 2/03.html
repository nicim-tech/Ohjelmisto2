<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <p id="target"></p>
    <script>
      "use strict";
      const number1 = Number(prompt("Type a number "));
      const number2 = Number(prompt("Type a number "));
      const number3 = Number(prompt("Type a number "));

      const sum = number1 + number2 + number3;
      const product = number1 * number2 * number3;
      const average = sum / 3;

      document.querySelector("#target").innerHTML =
        "Summa: " + sum + "<br>" +
        "Tulo: " + product + "<br>" +
        "Keskiarvo: " + average;
    </script>
  </body>
</html>
